
name: AI Intraday Paper Trader

on:
  schedule:
    # Every 5 minutes, weekdays.
    # Python enforces Eastern market-session hours.
    - cron: '*/5 13-21 * * 1-5'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-intraday-paper-trader
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Execute intraday paper trading strategy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python intraday_trade_runner.py
