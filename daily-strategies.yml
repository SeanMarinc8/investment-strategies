name: Daily Strategy Lab Update

on:
  schedule:
    # 22:00 UTC is after US market close in both EST and EDT.
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run paper strategies and portfolio valuation
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python daily_runner.py
